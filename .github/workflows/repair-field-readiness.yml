name: Repair field readiness
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth guard, route registration and readiness gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          s = app.read_text()

          guard = ' if(loading)return <DataLoadingScreen/>;if(!session?.user)return <AuthScreen/>;'
          if guard.strip() not in s:
              s = s.replace(' const screens=', guard + ' const screens=', 1)

          anchor = 'Jobs:<JobsScreen userId={session.user.id} teamId={teamId} setData={setData}/>'
          routes = 'Planner:<WeeklyPlannerScreen data={data} setData={setData} userId={session.user.id} teamId={teamId}/>,ColdCall:<ColdCallScreen data={data} setData={setData} userId={session.user.id} teamId={teamId}/>,JackSelector:<JackSelectorScreen data={data} setData={setData} userId={session.user.id} teamId={teamId}/>,Meeting:<MeetingScreen data={data} setData={setData} userId={session.user.id} teamId={teamId}/>,VehicleCheck:<VehicleCheckScreen data={data} setData={setData} userId={session.user.id} teamId={teamId}/>,Breakdown:<BreakdownScreen data={data} setData={setData} userId={session.user.id} teamId={teamId}/>,Repair:<RepairScreen data={data} setData={setData} userId={session.user.id} teamId={teamId}/>,'
          if 'Planner:<WeeklyPlannerScreen' not in s:
              s = s.replace(anchor, routes + anchor, 1)

          valid_old = '"Quotes","Expenses","More"'
          valid_new = '"Quotes","Expenses","More","Planner","ColdCall","JackSelector","Meeting","Breakdown","Repair"'
          s = s.replace(valid_old, valid_new, 1)
          app.write_text(s)

          p = Path('scripts/field-readiness.mjs')
          r = p.read_text()
          old = 'const screenKeys=[...app.matchAll(/^\\s{4}(\\w+):\\s*</gm)].map(m=>m[1]);'
          new = 'const screenKeys=[...app.matchAll(/(?:const screens=\\{|,)(\\w+):\\s*</g)].map(m=>m[1]);'
          if old in r:
              r = r.replace(old, new, 1)
          p.write_text(r)
          PY
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx scripts/field-readiness.mjs
          if ! git diff --cached --quiet; then git commit -m "fix: restore auth guard and field route readiness"; fi
          rm -f .github/workflows/repair-field-readiness.yml
          git add .github/workflows/repair-field-readiness.yml
          if ! git diff --cached --quiet; then git commit -m "chore: remove one-shot field readiness repair"; fi
          git push
