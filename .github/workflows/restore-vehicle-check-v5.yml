name: Restore vehicle check screen v5
on:
  push:
    branches: [main]

jobs:
  restore:
    if: github.actor == 'cvanjaarsveld2-alt'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original screen
        shell: bash
        run: |
          git checkout 2c65c1182a8015a3b6ed5855c96841771464da5d -- src/screens/VehicleCheckScreen.jsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/VehicleCheckScreen.jsx')
          s = p.read_text()
          old = '      data: JSON.stringify(dayData),'
          if old not in s:
              raise SystemExit('Expected JSON.stringify(dayData) not found')
          p.write_text(s.replace(old, '      data: dayData,', 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/VehicleCheckScreen.jsx
          git commit -m 'Fix vehicle check JSONB payload'
          git push --force-with-lease origin HEAD:main
