name: Repair vehicle check screen
on:
  push:
    branches: [main]

jobs:
  repair:
    if: github.actor == 'cvanjaarsveld2-alt'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore screen and fix jsonb payload
        shell: bash
        run: |
          git checkout 2c65c1182a8015a3b6ed5855c96841771464da5d -- src/screens/VehicleCheckScreen.jsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/VehicleCheckScreen.jsx')
          s = p.read_text()
          old = '      data: JSON.stringify(dayData),'
          new = '      data: dayData,'
          if old not in s:
              raise SystemExit('Expected vehicle_checks payload line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/VehicleCheckScreen.jsx
          git commit -m 'Restore vehicle check screen and fix jsonb sync'
          git push
      - name: Remove repair workflow
        shell: bash
        run: |
          rm .github/workflows/repair-vehicle-check.yml
          git add .github/workflows/repair-vehicle-check.yml
          git commit -m 'Remove temporary vehicle repair workflow'
          git push
