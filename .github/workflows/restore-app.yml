name: Restore App

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore App from known-good commit
        run: |
          git checkout 329f52c42bb3b2996080d19036eeb3be950065b4 -- src/App.jsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          s = s.replace('runQuoteAutomations(data, setData, session?.user?.id);', 'runQuoteAutomations(data, setData, session?.user?.id, teamId);')
          p.write_text(s)
          PY
          rm -f .github/workflows/restore-app.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/restore-app.yml
          git commit -m "Restore App and pass team context to quote automation"
          git push
