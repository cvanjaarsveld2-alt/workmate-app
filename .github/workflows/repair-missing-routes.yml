name: Repair missing app routes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Analytics Leads Team routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          anchor = 'Planner:<WeeklyPlannerScreen'
          routes = 'Analytics:<AnalyticsScreen data={data} setData={setData} userId={session.user.id} teamId={teamId}/>,Leads:<LeadsScreen data={data} setData={setData} userId={session.user.id} teamId={teamId} teamMembers={teamMembers}/>,Team:<TeamScreen data={data} setData={setData} userId={session.user.id} teamId={teamId} teamMembers={teamMembers} userRole={userRole}/>, '
          if 'Analytics:<AnalyticsScreen' not in s:
              s = s.replace(anchor, routes + anchor, 1)
          p.write_text(s)
          PY
      - name: Commit and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if ! git diff --cached --quiet; then git commit -m "fix: register analytics leads and team routes"; fi
          rm -f .github/workflows/repair-missing-routes.yml
          git add .github/workflows/repair-missing-routes.yml
          if ! git diff --cached --quiet; then git commit -m "chore: remove one-shot route repair"; fi
          git push
