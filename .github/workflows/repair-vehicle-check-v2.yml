name: Repair vehicle check sync v2
on:
  push:
    branches: [main]

jobs:
  repair:
    if: github.actor == 'cvanjaarsveld2-alt'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and harden vehicle check sync
        shell: bash
        run: |
          git checkout 2c65c1182a8015a3b6ed5855c96841771464da5d -- src/screens/VehicleCheckScreen.jsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/screens/VehicleCheckScreen.jsx')
          s = p.read_text()
          old = '      data: JSON.stringify(dayData),'
          if old not in s:
              raise SystemExit('Expected vehicle_checks payload line not found')
          p.write_text(s.replace(old, '      data: dayData,', 1))

          p = Path('src/lib/sync.js')
          s = p.read_text()
          old = 'async function pushOne(table,action,rawData){let payload=sanitizeRemotePayload(table,cleanNumerics(cleanUUIDs(rawData)));if(payload.media)'
          new = 'async function pushOne(table,action,rawData){let payload=sanitizeRemotePayload(table,cleanNumerics(cleanUUIDs(rawData)));if(table==="vehicle_checks"&&typeof payload.data==="string"){try{payload.data=JSON.parse(payload.data);}catch{throw new Error("Invalid vehicle_checks JSON payload");}}if(payload.media)'
          if old not in s:
              raise SystemExit('Expected sync pushOne anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f vehicle-check-repair-trigger.txt
          rm -f .github/workflows/repair-vehicle-check.yml .github/workflows/repair-vehicle-check-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/screens/VehicleCheckScreen.jsx src/lib/sync.js vehicle-check-repair-trigger.txt .github/workflows/repair-vehicle-check.yml .github/workflows/repair-vehicle-check-v2.yml
          git commit -m 'Fix vehicle check jsonb sync payload'
          git push
