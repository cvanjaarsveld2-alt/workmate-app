name: PowerMate Build Debug

on:
  push:
    branches: ["powermate-audit-fixes-2026-09-15"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build with full log
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powermate-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3
